function radar(rows){let n=rows.length;return '<svg class="n95Radar" viewBox="0 0 720 510" role="img" aria-label="'+t('Personal mental map. Demonstrative index from zero to one hundred.','Mapa mental pessoal. Índice demonstrativo de zero a cem.')+'"><defs><radialGradient id="n95glow"><stop stop-color="#55e3cc" stop-opacity=".28"/><stop offset="1" stop-color="#55e3cc" stop-opacity=".04"/></radialGradient></defs>'+[.25,.5,.75,1].map(k=>'<polygon points="'+rows.map((r,i)=>point(i,n,158*k).join(',')).join(' ')+'" fill="none" stroke="#afcbd320"/>').join('')+rows.map((r,i)=>'<path d="M360 250 L'+point(i,n,158).join(' ')+'" stroke="#afcbd320"/>').join('')+'<polygon points="'+polygon(rows,true)+'" fill="none" stroke="#8296b5" stroke-width="2" stroke-dasharray="5 6"/><polygon class="n95Shape" points="'+polygon(rows,false)+'" fill="url(#n95glow)" stroke="#55e3cc" stroke-width="3"/>'+rows.map((row,i)=>{const a=abilities[row[0]],p=point(i,n,158*a.value/100),q=point(i,n,205),align=q[0]<330?'end':q[0]>390?'start':'middle';return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#55e3cc"/><g class="n95Axis" tabindex="0" role="button" aria-label="'+a[S.lang]+' '+a.value+' / 100" onclick="n95Select(\''+row[0]+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();n95Select(\''+row[0]+'\')}"><text x="'+q[0]+'" y="'+q[1]+'" text-anchor="'+align+'">'+(shortLabels[row[0]]?shortLabels[row[0]][S.lang==='PT'?1:0]:a[S.lang])+'</text><text class="n95Score" x="'+q[0]+'" y="'+(q[1]+23)+'" text-anchor="'+align+'">'+a.value+'<tspan font-size="11" fill="#8da7b8"> / 100</tspan></text></g>';}).join('')+'<text x="368" y="246" fill="#a4bfce" font-size="10">0</text><text x="368" y="94" fill="#a4bfce" font-size="10">100</text></svg>';}
function detail(rows){const row=rows.find(r=>r[0]===selected)||rows[0],a=abilities[row[0]],x=item(row);return '<div class="n95Detail"><div class="kicker">'+t('YOUR TRAINING PATHWAY','O TEU PERCURSO DE TREINO')+'</div><h2>'+a[S.lang]+'</h2><strong>'+a.value+'<small> / 100</small></strong><p class="n95Delta">+'+(a.value-a.starting)+' '+t('vs. your starting point','face ao teu ponto de partida')+'</p><p>'+x[S.lang].d+'</p><span class="pill">'+status(x)+'</span><p class="note">'+t('Illustrative ability index, not a population percentile. Source: predefined demonstration profile; not resting EEG.','Índice ilustrativo da capacidade, não um percentil da população. Origem: perfil demonstrativo predefinido; não EEG em repouso.')+'</p><button class="secondary" onclick="selectTraining(\''+x.id+'\')">'+(x.status==='live'?t('Explore training →','Explorar treino →'):t('View future capability →','Ver capacidade futura →'))+'</button></div>';}
function map(){const rows=scope==='all'?list():list().filter(r=>r[2]===scope);return '<div class="panel n95Map"><div class="n95MapHead"><div><div class="kicker">'+t('MENTAL ABILITIES · PERSONAL PROFILE','MENTAL ABILITIES · PERFIL PESSOAL')+'</div><h2>'+t('Your mental map.','O teu mapa mental.')+'</h2><p>'+t('A view of your strengths and training pathways.','Uma visão das tuas capacidades e dos teus percursos de treino.')+'</p></div><div class="n95Scope">'+[['all',t('Full map','Mapa completo')],['regular',t('Regulate','Regular')],['perform',t('Perform','Performar')]].map(([id,label])=>'<button class="'+(scope===id?'active':'')+'" onclick="n95Scope(\''+id+'\')">'+label+'</button>').join('')+'</div></div><div class="n95MapBody"><div>'+ (rows.length>=3?radar(rows):'<div class="n95Few">'+rows.map(r=>'<button onclick="n95Select(\''+r[0]+'\')"><span>'+abilities[r[0]][S.lang]+'</span><strong>'+abilities[r[0]].value+' / 100</strong><i style="--score:'+abilities[r[0]].value+'%"></i></button>').join('')+'<p class="note">'+t('This pathway currently has two mapped abilities.','Este percurso tem atualmente duas capacidades mapeadas.')+'</p></div>')+'<div class="chartLegend"><span><i></i>'+t('Now','Agora')+'</span><span><i class="base"></i>'+t('Starting point','Ponto de partida')+'</span></div><div class="n95AxisButtons">'+rows.map(r=>'<button class="'+(selected===r[0]?'active':'')+'" onclick="n95Select(\''+r[0]+'\')">'+abilities[r[0]][S.lang]+' <b>'+abilities[r[0]].value+'</b></button>').join('')+'</div></div>'+detail(rows)+'</div><p class="note">'+t('Demonstrative map. Changing segment changes the axes and relevant pathways, not your personal scores. Future assessments and task results require validated scoring before filling this map.','Mapa demonstrativo. Mudar de segmento altera os eixos e os percursos relevantes, não as tuas pontuações pessoais. Avaliações futuras e resultados de desafios precisam de uma pontuação validada antes de preencher este mapa.')+'</p></div><div class="n95States"><div class="n95StateHead"><h2>'+t('Your current state','O teu estado atual')+'</h2><span class="demo">'+t('SIMULATED ESTIMATES','ESTIMATIVAS SIMULADAS')+'</span></div><p class="note">'+t('Separate from abilities: intensity from 0 to 100, not a score of how good you are.','Separado das capacidades: intensidade de 0 a 100, não uma pontuação de quão bom és.')+'</p><div class="n95StateGrid">'+states.map(([sig,en,pt,value,col])=>'<div class="n95State"><span style="color:'+col+'">'+sig+' · '+t(en,pt)+'</span><strong>'+value+'<small> / 100</small></strong><svg viewBox="0 0 180 32" aria-hidden="true"><path d="M0 25 L15 22 L30 24 L45 15 L60 19 L75 14 L90 17 L105 9 L120 13 L135 7 L150 12 L165 6 L180 9" fill="none" stroke="'+col+'" stroke-width="2"/></svg></div>').join('')+'</div><p class="note">'+t('Metric names identified from your EmotivPRO reference. The prototype has no Emotiv connection or metric algorithm. Resting Brain Check does not automatically measure these states or abilities.','Nomes das métricas identificados na tua referência EmotivPRO. O protótipo não tem ligação à Emotiv nem algoritmo destas métricas. O Brain Check em repouso não mede automaticamente estes estados ou capacidades.')+'</p></div>';}
const oldHome=window.home,oldGo=window.go;
function home(){
 const box=document.createElement('div');box.innerHTML=map();
 box.querySelectorAll('.n95Axis').forEach(g=>{const text=g.querySelector('text'),x=Number(text.getAttribute('x')),y=Number(text.getAttribute('y')),anchor=text.getAttribute('text-anchor');const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',x-(anchor==='end'?180:anchor==='middle'?90:0));r.setAttribute('y',y-20);r.setAttribute('width','180');r.setAttribute('height','55');r.setAttribute('fill','transparent');g.prepend(r);});
 const states=box.querySelector('.n95States');states.remove();
 const detailNode=box.querySelector('.n95Detail');detailNode.classList.add('n96Collapsed');
 const body=box.querySelector('.n95MapBody');body.classList.add('n96MapBody');
 const mapNote=box.querySelector('.n95Map > .note');if(mapNote)mapNote.remove();
 const subtitle=box.querySelector('.n95MapHead p');subtitle.textContent=t('See where you started and how you have progressed.','Vê de onde partiste e como tens evoluído.');
 const chips=box.querySelector('.n95AxisButtons');
 const more=document.createElement('details');more.className='n96Abilities';more.innerHTML='<summary>'+t('Explore each ability','Explorar cada capacidade')+'</summary>';chips.replaceWith(more);more.appendChild(chips);
 return '<section class="v94 n96Dashboard"><div class="n96Topline"><span class="kicker">'+(document.querySelector('.nSeg option:checked')?.textContent||S.segment)+' · '+t('PERSONAL PROFILE','PERFIL PESSOAL')+'</span><span class="demo">'+t('SIMULATED DATA','DADOS SIMULADOS')+'</span></div>'+box.innerHTML+'<div class="n96Next"><button class="primary" onclick="go(\'nextsession\')">'+t('Go to your next training →','Ir para o próximo treino →')+'</button><button class="link" onclick="go(\'progress\')">'+t('View progress','Ver evolução')+'</button></div><details class="n96StateDetails"><summary>'+t('View your current state','Ver o teu estado atual')+'</summary>'+states.outerHTML+'</details><div class="n96FooterLinks"><button class="link" onclick="go(\'measure\')">Brain Check</button><button class="link" onclick="go(\'train\')">'+t('Explore abilities','Explorar capacidades')+'</button></div><p class="note">'+t('Illustrative profile · 0–100 index · starting point held constant.','Perfil ilustrativo · índice 0–100 · ponto de partida mantido fixo.')+'</p></section>';
}
function nextSession(){
 const box=document.createElement('div');box.innerHTML=oldHome();
 return '<section class="v94 n96Session"><button class="link" onclick="go(\'home\')">← '+t('Back to my map','Voltar ao meu mapa')+'</button><div class="intro"><div><div class="kicker">'+t('YOUR NEXT STEP','O TEU PRÓXIMO PASSO')+'</div><h1>'+t('Your next session','A tua próxima sessão')+'</h1></div><span class="demo">'+t('DEMONSTRATIVE RECOMMENDATION','RECOMENDAÇÃO DEMONSTRATIVA')+'</span></div>'+box.querySelector('.hero').outerHTML+'<div class="actions"><button class="secondary" onclick="go(\'measure\')">Brain Check</button><button class="secondary" onclick="go(\'train\')">'+t('Explore other experiences','Explorar outras experiências')+'</button></div></section>';
}
function refresh(){oldGo('home');document.getElementById('main').innerHTML=home();}
window.n95Select=key=>{selected=key;const rows=scope==='all'?list():list().filter(r=>r[2]===scope);const d=document.querySelector('.n95Detail');if(d)d.outerHTML=detail(rows)+'<button class="link n96Close" onclick="n96CloseAbility()">'+t('Close detail','Fechar detalhe')+'</button>';document.querySelectorAll('.n96Close').forEach((b,i)=>{if(i)b.remove();});document.querySelectorAll('.n95AxisButtons button').forEach(b=>b.classList.toggle('active',b.textContent.includes(abilities[key][S.lang])));};
window.n95Scope=value=>{scope=value;selected=null;refresh();};
window.n96CloseAbility=()=>{const d=document.querySelector('.n95Detail');if(d)d.classList.add('n96Collapsed');document.querySelectorAll('.n96Close').forEach(b=>b.remove());};
window.home=home;window.landing=home;
window.go=function(v){if(v==='nextsession'){oldGo('home');S.view='nextsession';const main=document.getElementById('main');main.dataset.view='nextsession';main.innerHTML=nextSession();if(typeof v84Footer==='function')v84Footer();window.scrollTo(0,0);return;}const r=oldGo(v);if(v==='home'||v==='landing')document.getElementById('main').innerHTML=home();if(typeof v84Footer==='function')v84Footer();return r;};
window.goHome=()=>window.go('home');
window.n95Abilities=abilities;window.n95Maps=maps;window.n95States=states;
window.go('home');
})();
</script><style id="nrsBoot">#main{visibility:hidden}</style><script type="module" src="js/neroes.js"></script></body></html>
