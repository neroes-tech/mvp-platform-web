.strategyDemo{height:180px;border-radius:22px;background:radial-gradient(circle at 50% 50%,#1dcacb33,#071b2b);position:relative;overflow:hidden;margin:20px 0}.strategyOrb{position:absolute;width:56px;height:56px;border-radius:50%;left:calc(50% - 28px);top:100px;background:radial-gradient(circle at 35% 30%,#fff,#56e7df 35%,#087bb7);box-shadow:0 0 40px #35dacf;transition:1s}.strategyOrb.up{top:32px}.risk{display:inline-block;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:800}.risk.ok{background:#e5f8ef;color:#167451}.risk.watch{background:#fff5d9;color:#8a6510}.risk.high{background:#ffe8e8;color:#a43b3b}.braincheckHero{background:linear-gradient(120deg,#073f57,#0a7d88);color:white;border-radius:30px;padding:36px;margin:20px 0}.braincheckHero h3{font-size:38px;margin:8px 0}.proofStrip{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.proofStrip span{padding:9px 13px;border-radius:99px;background:#e9f9f6;font-weight:700;color:#126b69;font-size:12px}.winBanner{padding:18px 22px;border-radius:20px;background:linear-gradient(90deg,#eafbf6,#edf7ff);border:1px solid #cfece7;margin:18px 0}.gameMilestone{position:fixed;right:28px;top:90px;z-index:25;color:#fff;background:#061826aa;border:1px solid #ffffff30;border-radius:16px;padding:12px 16px;backdrop-filter:blur(12px);font-size:12px}.gameMilestone b{display:block;font-size:18px;margin-top:3px}
@media(max-width:800px){.milestones{grid-template-columns:1fr 1fr}.rewardHud{left:10px;transform:translateY(-50%) scale(.8)}}
</style>

</head><body><div class="app"><header class="top"><div class="brand" onclick="go('landing')" style="cursor:pointer"><img src="assets/image-1.png"></div><div class="row"><button class="pill" onclick="howItWorks()">How Neroes technology works</button><button class="pill" onclick="operatorView()">Operator</button><button class="pill" id="segpill" onclick="go('landing')">Choose segment</button><button class="pill" onclick="demoMenu()">Demo mode</button></div></header><main id="main"></main></div><div id="game" class="game hidden"></div>
<script>
window.nGT=function(s){return s};
const S={segment:null,training:null,session:2,totalSessions:8,difficulty:3,score:{focus:82,memory:71,decision:76,control:69,regulation:74,reaction:88},hits:0,rts:[]};
const trainings={
Corporate:[['Deep Focus','Sustained attention and distraction resistance.','12 min · Intermediate'],['Working Memory','Hold and manipulate information under cognitive load.','10 min · Intermediate'],['Decision Under Pressure','Maintain decision quality while pressure increases.','12 min · Advanced'],['Cognitive Control','Stay aligned despite competing stimuli.','10 min · Intermediate'],['Stress Regulation','Regulate arousal during demanding situations.','12 min · Beginner'],['Meditative Focus','Develop attention stability through a levitation experience.','15 min · Beginner']],
Sports:[['Performance Under Pressure','Perform accurately while pressure changes.','10 min · Advanced'],['Reaction & Readiness','Respond rapidly while maintaining control.','8 min · Intermediate'],['Sustained Focus','Maintain attention across extended performance.','12 min · Intermediate'],['Decision Under Pressure','Process information under time pressure.','10 min · Advanced'],['Cognitive Control','Resist distraction and stay on objective.','10 min · Intermediate'],['Arousal Regulation','Regulate activation before and during performance.','12 min · Beginner']],
Clinical:[['Inner Space','Clinician-guided emotional self-regulation.','12 min · Guided'],['Arousal Regulation','Practice regulation of arousal-related patterns.','12 min · Guided'],['Guided Regulation','Clinician-guided neurofeedback focused on self-regulation.','15 min · Guided'],['Cue Response Regulation','Guided training related to cue response and self-regulation.','15 min · Guided'],['Attention Regulation','Train stability of attentional states.','10 min · Guided'],['Meditative Regulation','Attention-based regulation through a levitation experience.','15 min · Guided']],
Schools:[['Focus Flight','Keep attention stable to guide a balloon through a playful 3D world.','8 min · Beginner'],['Learning Focus','Sustain attention during learning challenges.','8 min · Beginner'],['Working Memory','Remember and reproduce visual sequences.','8 min · Beginner'],['Impulse Control','Pause, select and respond to the right signal.','7 min · Beginner'],['Calm & Ready','Regulate activation before learning.','8 min · Beginner'],['Cognitive Flexibility','Switch between rules while staying accurate.','8 min · Intermediate']],
Fitness:[['Fitness','Build mental endurance through an adaptive energy challenge.','10 min · Intermediate'],['Mind-Muscle Focus','Maintain attention through a sustained performance set.','10 min · Intermediate'],['Reaction Circuit','Fast cognitive reaction rounds with adaptive difficulty.','8 min · Intermediate'],['Recovery Control','Practice down-regulation after high activation.','10 min · Beginner'],['Performance Under Pressure','Maintain control as intensity increases.','10 min · Advanced'],['Meditative Recovery','Use a levitation experience for calm attention and recovery.','12 min · Beginner']]
};
function go(v){window.scrollTo(0,0); const m=document.getElementById('main'); m.className='fade'; if(v==='landing')m.innerHTML=landing(); if(v==='home')m.innerHTML=home(); if(v==='measure')m.innerHTML=measure(); if(v==='train')m.innerHTML=train(); if(v==='progress')m.innerHTML=progress();}
function pick(segment){S.segment=segment;document.getElementById('segpill').textContent=segment;go('home');}
function landing(){const segs=[['Corporate','Mental performance at work.','01'],['Sports','Train the mind behind performance.','02'],['Clinical','Clinician-guided neurofeedback experiences.','03'],['Schools','Attention, learning and self-regulation for students.','04'],['Fitness','A mental gym for cognitive fitness and recovery.','05']];return `<section class="wrap"><img class="logoHero" src="${document.querySelector('.brand img').src}"><div class="eyebrow">From subjective to measurable</div><h1>Train your brain.<br>Understand your performance.</h1><p class="lead">Choose the environment in which you want to perform better.</p><div class="grid5">${segs.map(([x,d,n])=>`<div class="card ${x==='Clinical'?'clinical':x==='Schools'?'schoolCard':x==='Fitness'?'fitnessCard':''}" onclick="pick('${x}')"><span class="num">${n}</span><h3>${x.toUpperCase()}</h3><p>${d}</p><span class="tag">Explore →</span></div>`).join('')}</div><div class="row" style="margin-top:28px"><button class="cta ghost" onclick="howItWorks()">NEW TO NEUROFEEDBACK? SEE HOW IT WORKS →</button></div><div class="footerNote">High-fidelity concept prototype · simulated neurofeedback data</div></section>`}
function programDots(){return `<div class="sessionDots">${Array.from({length:S.totalSessions},(_,i)=>`<i class="${i<S.session-1?'done':i===S.session-1?'now':''}"></i>`).join('')}</div>`}
function home(){return `<section class="wrap"><div class="eyebrow">${S.segment||'Neroes'} experience</div><h2>Welcome back, Ana Ribeiro.</h2><div class="programHero"><span class="mini" style="color:#bdece8">YOUR 8-SESSION PROGRAM</span><h3 style="font-size:30px;margin-top:8px">Session ${S.session} of ${S.totalSessions} · Build reliable mental control</h3>${programDots()}<p>${Math.round((S.session-1)/S.totalSessions*100)}% complete · Today's goal: create clear evidence of progress from your own baseline.</p><button class="cta" onclick="go('train')">CONTINUE PROGRAM</button></div><p class="lead" style="margin-top:35px">Or choose what you want to do.</p><div class="grid3"><div class="card" onclick="go('measure')"><span class="num">MEASURE</span><h3>5-minute Brain Check</h3><p>A standalone performance snapshot that can be used before a training program.</p><span class="productTag">Standalone product</span></div><div class="card" onclick="go('train')"><span class="num">TRAIN</span><h3>Train an ability</h3><p>Follow your program or explore a specific neurofeedback experience.</p></div><div class="card" onclick="go('progress')"><span class="num">TRACK</span><h3>Your progress</h3><p>See improvement against your own Session 1 baseline — not an isolated score.</p></div></div></section>`}
function measure(){return `<section class="wrap"><div class="eyebrow">Measure · ${S.segment}</div><h2>Brain Check</h2><p class="lead">A 5–8 minute snapshot of your cognitive performance.</p><div class="setup"><h3>Prepare your headset</h3><p>Complete a few short challenges while Neroes measures how you respond.</p><div class="ring"><b>94%</b></div><p><b>Headset connected ✓</b><br><span class="mini">Signal quality · Excellent</span></p><button class="cta" onclick="braincheck()">START BRAIN CHECK</button></div></section>`}
function braincheck(){let m=document.getElementById('main');m.innerHTML=`<section class="wrap"><div class="setup"><div class="eyebrow">Baseline calibration</div><h2 id="cal">Finding your baseline…</h2><div class="ring"><b id="count">3</b></div><p id="sub">Learning your resting pattern.</p></div></section>`;let n=3;let t=setInterval(()=>{n--;let cEl=document.getElementById('count'),calEl=document.getElementById('cal');if(!cEl){clearInterval(t);return}cEl.textContent=Math.max(n,0);if(n===1&&calEl)calEl.textContent='Signal stable.';if(n<=0){clearInterval(t);assessment()}},700)}
function assessment(){let m=document.getElementById('main');let tasks=['Focus on the center','Remember: 7 · 2 · 9','Ignore the distractor','Choose quickly','Regulate and recover'];let i=0;m.innerHTML=`<section class="wrap"><div class="setup"><div class="eyebrow">Brain Check</div><h2 id="task">${tasks[0]}</h2><p>Short simulated assessment · demo mode</p><div style="font-size:90px;margin:30px">●</div><button class="cta" id="next">RESPOND</button></div></section>`;document.getElementById('next').onclick=()=>{i++;if(i<tasks.length)document.getElementById('task').textContent=tasks[i];else results(true)}}
function results(fromMeasure=false){let rec=S.segment==='Sports'?'Performance Under Pressure':S.segment==='Clinical'?'Inner Space':S.segment==='Schools'?'Focus Flight':S.segment==='Fitness'?'Fitness':'Deep Focus';document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">${fromMeasure?'Brain Check complete':'Session complete'}</div><h2>${fromMeasure?'Your Brain Performance Profile':'What happened'}</h2><div class="grid2"><div class="card" style="cursor:default"><div class="radar"></div></div><div><div class="bars">${Object.entries(S.score).map(([k,v])=>`<div class="bar"><b>${cap(k)}</b><div class="track"><div class="fill" style="width:${v}%"></div></div><b>${v}</b></div>`).join('')}</div></div></div><div class="grid2"><div class="card" style="cursor:default"><span class="num">YOUR STRENGTH</span><h3>${S.segment==='Sports'?'Reaction Speed':'Focus Stability'}</h3><p>Your strongest periods appeared in the final third of the assessment.</p></div><div class="card" onclick="selectTraining('${rec}')"><span class="num">RECOMMENDED FOR YOU</span><h3>${rec}</h3><p>${S.segment==='Clinical'?'Guided regulation experience.':'Build stability and recover faster from distraction.'}</p><span class="tag">Start training →</span></div></div></section>`}
function cap(k){return k[0].toUpperCase()+k.slice(1)}
function train(){let arr=trainings[S.segment]||trainings.Corporate;return `<section class="wrap"><div class="eyebrow">Train · ${S.segment}</div><h2>What do you want to train?</h2><p class="lead">Experiences are adapted to the performance context you selected.</p><div class="grid3">${arr.map((a,i)=>`<div class="card" onclick="selectTraining('${a[0]}')"><span class="num">${String(i+1).padStart(2,'0')}</span><h3>${a[0]}</h3><p>${a[1]}</p><span class="tag">${a[2]}</span></div>`).join('')}</div></section>`}
function selectTraining(name){S.training=name;let arr=trainings[S.segment]||[];let a=arr.find(x=>x[0]===name)||[name,'Train neural self-regulation through an immersive experience.','12 min'];document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">${S.segment} · Session ${S.session} of ${S.totalSessions}</div><h1 style="font-size:58px">${name}</h1><p class="lead">${a[1]}</p><div class="timeline"><span class="done">1</span><b class="done"></b><span class="now">2</span><b></b><span>3</span><b></b><span>4</span><b></b><span>5</span><b></b><span>6</span><b></b><span>7</span><b></b><span>8</span></div><div class="grid2"><div class="card" style="cursor:default"><span class="num">TODAY'S OBJECTIVE</span><h3>Prove progress early</h3><p>Session ${S.session} establishes your personal reference before adaptive challenge increases.</p></div><div class="card" style="cursor:default"><span class="num">ADAPTIVE DIFFICULTY</span><h3>Level ${S.difficulty}</h3><p>Difficulty can rise as you improve. Performance is always reported together with the difficulty level at which it was produced.</p></div></div><div class="row" style="margin-top:28px"><button class="cta" onclick="strategyTutorial()">LEARN THE STRATEGY</button><button class="cta ghost" onclick="setupTrain()">SKIP IN DEMO</button></div></section>`}
function strategyTutorial(){document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">Before you train</div><h2>There isn't one “right” way to control the game.</h2><p class="lead">Try these three learning strategies. Notice which one helps the environment respond.</p><div class="strategy"><div class="card"><span class="num">01 · CONSCIOUS</span><h3>Direct</h3><p>Intentionally place your attention on the task. Keep it simple and steady.</p></div><div class="card"><span class="num">02 · SUBCONSCIOUS</span><h3>Allow</h3><p>Stop micromanaging the result. Observe what happens when you reduce effort.</p></div><div class="card"><span class="num">03 · BELIEFS</span><h3>Expect</h3><p>Notice whether your expectation changes how easily you enter and maintain the state.</p></div></div><div class="deltaHero"><b>SESSION ${S.session} GOAL</b><h3 style="font-size:28px">Experience control — not perfection.</h3><p>The first sessions calibrate the training threshold to your own baseline. Challenge increases from there.</p></div><div class="row" style="margin-top:24px"><button class="cta" onclick="setupTrain()">I'M READY</button></div></section>`}
function setupTrain(){document.getElementById('main').innerHTML=`<section class="wrap"><div class="setup"><div class="eyebrow">${S.training} · Session ${S.session}/${S.totalSessions}</div><h2>Signal check</h2><div class="ring"><b>96%</b></div><p><b>Headset connected ✓</b><br>Signal quality · Excellent</p><div class="row" style="justify-content:center"><button class="cta" onclick="startGame()">BEGIN TRAINING</button><button class="cta ghost" onclick="signalRecovery()">DEMO SIGNAL ISSUE</button></div></div></section>`}
function signalRecovery(){document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">Signal recovery</div><h2>We found a connection issue.</h2><p class="lead">The session is paused safely. No invalid signal will count toward the participant's result.</p><div class="signalPanel"><div class="card signalBad" style="cursor:default"><span class="num">CHECK SENSOR</span><h3>F3 · Poor contact</h3><p>1. Adjust the left sensor.<br>2. Move hair away from the contact area.<br>3. Make sure the sensor is touching the scalp.</p></div><div class="card" style="cursor:default"><span class="num">SESSION PROTECTION</span><h3>Progress saved ✓</h3><p>Valid training time is preserved. The operator can recheck the signal and continue without restarting the session.</p></div></div><div class="row" style="margin-top:25px"><button class="cta" onclick="setupTrain()">RECHECK SIGNAL</button><button class="cta ghost" onclick="startGame()">CONTINUE IN DEMO</button></div></section>`}
function startGame(){if(S.training.includes('Meditative'))levitateGame();else if(S.segment==='Schools')schoolFlight();else if(S.segment==='Fitness')mentalGym();else if(S.segment==='Sports')sportsGame();else if(S.segment==='Clinical')innerSpace();else neuralFlight()}
function gameShell(title,instruction){let g=document.getElementById('game');g.classList.remove('hidden');g.innerHTML=`<canvas id="cv"></canvas><div class="hud"><div><b>NEROES</b><div style="opacity:.6;font-size:12px">${title}</div></div><div style="opacity:.7">${nGT('SIMULATED NEUROFEEDBACK')}</div></div><div class="instruction" id="instr">${instruction}</div><button class="gameExit" onclick="endGame()">${nGT('Complete session')}</button>`;return document.getElementById('cv')}
function neuralFlight(){let c=gameShell('DEEP FOCUS · SPACE FLIGHT','Keep the spacecraft on course.');let x=c.getContext('2d'),w,h,t=0,stars=Array.from({length:260},()=>({a:Math.random()*Math.PI*2,r:Math.random(),z:Math.random(),s:Math.random()*2+1}));function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();onresize=resize;function ship(cx,cy,focus){x.save();x.translate(cx,cy);x.shadowBlur=35;x.shadowColor='#38e9ff';x.fillStyle='#dffcff';x.beginPath();x.moveTo(0,-32);x.lineTo(28,28);x.lineTo(8,20);x.lineTo(0,35);x.lineTo(-8,20);x.lineTo(-28,28);x.closePath();x.fill();x.fillStyle='#17cbd7';x.beginPath();x.moveTo(-8,26);x.lineTo(0,65+18*focus);x.lineTo(8,26);x.closePath();x.fill();x.restore()}function draw(){t+=.013;let focus=.72+.18*Math.sin(t*.55)+.07*Math.sin(t*2.2);let gr=x.createRadialGradient(w*.5,h*.42,10,w*.5,h*.48,Math.max(w,h)*.7);gr.addColorStop(0,'#123b68');gr.addColorStop(.35,'#071d3c');gr.addColorStop(1,'#01050d');x.fillStyle=gr;x.fillRect(0,0,w,h);stars.forEach(p=>{p.z-=.008+.018*focus;if(p.z<.025){p.z=1;p.a=Math.random()*6.28;p.r=Math.random()}let rr=(1-p.z)*Math.max(w,h)*(.15+.65*p.r),px=w/2+Math.cos(p.a)*rr,py=h*.43+Math.sin(p.a)*rr*.55,sz=p.s*(1/p.z)*.6;x.strokeStyle=focus>.72?'#78fff1':'#5fb8ff';x.globalAlpha=Math.min(.9,(1-p.z)*1.4);x.beginPath();x.moveTo(px,py);x.lineTo(w/2+(px-w/2)*1.025,h*.43+(py-h*.43)*1.025);x.stroke();x.fillStyle='#dffcff';x.beginPath();x.arc(px,py,Math.min(4,sz),0,7);x.fill()});x.globalAlpha=1;let wobble=(1-focus)*22*Math.sin(t*8);ship(w/2+wobble,h*.72,focus);x.strokeStyle='#4deee855';x.lineWidth=2;for(let i=0;i<3;i++){x.beginPath();x.ellipse(w/2,h*.43,w*(.12+i*.12)*(1.2-focus*.25),h*(.05+i*.05),0,0,7);x.stroke()}requestAnimationFrame(draw)}draw();setTimeout(()=>{let e=document.getElementById('instr');if(e)e.textContent='Hold the course.'},7000)}
function levitateGame(){let c=gameShell('MEDITATIVE FOCUS · LEVITATE','Settle your attention.');let x=c.getContext('2d'),w,h,t=0,particles=Array.from({length:95},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3,p:Math.random()*6}));function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();onresize=resize;function meditator(cx,cy,scale,glow){x.save();x.translate(cx,cy);x.scale(scale,scale);x.shadowBlur=30+40*glow;x.shadowColor='#b7fff0';x.fillStyle='#eafdf8';x.beginPath();x.arc(0,-66,18,0,7);x.fill();x.strokeStyle='#eafdf8';x.lineWidth=15;x.lineCap='round';x.beginPath();x.moveTo(0,-45);x.lineTo(0,5);x.stroke();x.lineWidth=13;x.beginPath();x.moveTo(-5,-30);x.quadraticCurveTo(-36,-5,-55,20);x.moveTo(5,-30);x.quadraticCurveTo(36,-5,55,20);x.stroke();x.lineWidth=16;x.beginPath();x.moveTo(0,2);x.quadraticCurveTo(-30,22,-58,30);x.quadraticCurveTo(-28,42,0,28);x.quadraticCurveTo(28,42,58,30);x.quadraticCurveTo(30,22,0,2);x.stroke();x.restore()}function draw(){t+=.01;let calm=.68+.24*Math.sin(t*.42)+.06*Math.sin(t*1.8),lift=35+95*calm+10*Math.sin(t*1.4);let gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#c8f3eb');gr.addColorStop(.46,'#7bcbd0');gr.addColorStop(.47,'#1d6f8a');gr.addColorStop(1,'#06273d');x.fillStyle=gr;x.fillRect(0,0,w,h);x.fillStyle='rgba(255,250,220,.55)';x.beginPath();x.arc(w*.78,h*.2,55+12*calm,0,7);x.fill();let baseY=h*.72;x.fillStyle='#173e4d';x.beginPath();x.ellipse(w/2,baseY+38,w*.18,35,0,0,7);x.fill();particles.forEach(p=>{p.y-=.0006*(.4+calm);if(p.y<0){p.y=1;p.x=Math.random()}let px=p.x*w+Math.sin(t*2+p.p)*10,py=p.y*h;x.fillStyle='rgba(255,255,255,.65)';x.beginPath();x.arc(px,py,p.r*(.7+calm),0,7);x.fill()});x.strokeStyle='rgba(204,255,247,.32)';x.lineWidth=2;for(let i=0;i<4;i++){x.beginPath();x.ellipse(w/2,baseY-lift+15,80+i*32,18+i*8,0,0,7);x.stroke()}meditator(w/2,baseY-lift,1.05,calm);requestAnimationFrame(draw)}draw();setTimeout(()=>{let e=document.getElementById('instr');if(e)e.textContent='Rise with the stillness.'},6500)}
function sportsGame(){let c=gameShell('PERFORMANCE UNDER PRESSURE','React to the targets.');let x=c.getContext('2d'),w,h,t=0;function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();onresize=resize;function bg(){t+=.02;let gr=x.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#041a2a');gr.addColorStop(.5,'#082f45');gr.addColorStop(1,'#090f21');x.fillStyle=gr;x.fillRect(0,0,w,h);x.strokeStyle='#1fd4e744';for(let i=0;i<14;i++){x.beginPath();x.arc(w/2,h/2,90+i*50+Math.sin(t+i)*12,0,Math.PI*2);x.stroke()}requestAnimationFrame(bg)}bg();spawnTarget();}
function spawnTarget(){let g=document.getElementById('game');let d=document.createElement('div');d.className='arenaTarget';d.style.left=(12+Math.random()*76)+'%';d.style.top=(24+Math.random()*55)+'%';let st=performance.now();d.onclick=()=>{S.hits++;S.rts.push(performance.now()-st);d.remove();spawnTarget()};g.appendChild(d);setTimeout(()=>{if(d.isConnected){d.remove();spawnTarget()}},1100)}
function innerSpace(){let c=gameShell('INNER SPACE · EMOTIONAL REGULATION','Let the environment settle with you.');let x=c.getContext('2d'),w,h,t=0,pts=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),r:1+Math.random()*3,p:Math.random()*6}));function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();onresize=resize;function draw(){t+=.01;let calm=.6+.3*Math.sin(t*.35);let gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#bce9e2');gr.addColorStop(.48,'#7bc7d0');gr.addColorStop(.5,'#267d9b');gr.addColorStop(1,'#062b43');x.fillStyle=gr;x.fillRect(0,0,w,h);x.fillStyle='#fff7';x.beginPath();x.arc(w*.78,h*.22,55,0,7);x.fill();x.strokeStyle='#cfffff55';for(let j=0;j<8;j++){x.beginPath();for(let i=0;i<=w;i+=16){let y=h*.57+j*25+Math.sin(i*.012+t*(1-calm)*3+j)*8*(1-calm);i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()}pts.forEach(p=>{p.y-=.0003*calm;if(p.y<0)p.y=1;let px=p.x*w+Math.sin(t+p.p)*12,py=p.y*h;x.fillStyle='#ffffffaa';x.beginPath();x.arc(px,py,p.r,0,7);x.fill()});requestAnimationFrame(draw)}draw()}
function howItWorks(){window.scrollTo(0,0);document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">Neroes neurotechnology</div><h2>How Neroes technology works</h2><p class="lead">A continuous learning loop turns live brain activity into immediate, intuitive feedback.</p>
<div class="nfVisual">

</div>
<div class="nfExplain"><div><span class="num">WHAT IS THE REWARD?</span><h3>The game itself.</h3><p>Instead of watching brainwave charts, the participant receives a consequence they can immediately understand. A meditator levitates. A spacecraft accelerates. A storm settles. A balloon gains altitude.</p></div><div><span class="num">WHY AI?</span><h3>The challenge follows the participant.</h3><p>The adaptive layer can continuously adjust difficulty, thresholds and game behaviour so the experience remains challenging without becoming frustrating.</p></div><div><span class="num">WHAT CHANGES OVER TIME?</span><h3>Self-regulation becomes a learned skill.</h3><p>The objective is not to consciously control a brainwave. The participant learns, through repeated feedback, to reproduce a functional state more consistently.</p></div></div>
<div class="nfExample"><div><span class="num">EXAMPLE · MEDITATIVE FOCUS</span><h3>Your state controls elevation.</h3><p>EEG detects the target state → Neroes interprets it → the character rises → the brain receives immediate feedback → the loop repeats continuously.</p></div><div class="miniLev"><div class="halo"></div><div class="medHead"></div><div class="medBody"></div><div class="medLeg"></div><div class="floatShadow"></div></div></div>

function schoolFlight(){let c=gameShell('SCHOOLS · FOCUS FLIGHT','Keep the balloon rising.');let x=c.getContext('2d'),w,h,t=0,clouds=Array.from({length:14},()=>({x:Math.random(),y:.1+Math.random()*.65,s:.5+Math.random()}));function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();onresize=resize;function draw(){t+=.012;let focus=.67+.22*Math.sin(t*.55)+.07*Math.sin(t*2.1);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#78d9ff');sky.addColorStop(.72,'#d8f6ff');sky.addColorStop(1,'#91d7b7');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#ffffffb8';clouds.forEach(q=>{q.x-=.00025*q.s;if(q.x<-.1)q.x=1.1;let cx=q.x*w,cy=q.y*h;x.beginPath();x.arc(cx,cy,35*q.s,0,7);x.arc(cx+38*q.s,cy+4,28*q.s,0,7);x.arc(cx-34*q.s,cy+7,24*q.s,0,7);x.fill()});x.fillStyle='#3d9870';x.beginPath();x.moveTo(0,h);for(let i=0;i<=w;i+=60)x.lineTo(i,h*.78+Math.sin(i*.01)*55);x.lineTo(w,h);x.fill();let bx=w*.5+Math.sin(t*.8)*(1-focus)*70,by=h*.66-focus*h*.30;x.save();x.translate(bx,by);x.fillStyle='#ffcc3f';x.beginPath();x.ellipse(0,-38,48,60,0,0,7);x.fill();x.strokeStyle='#fff7';x.lineWidth=6;for(let a=-25;a<=25;a+=25){x.beginPath();x.moveTo(a,-90);x.quadraticCurveTo(a*.5,-38,a,18);x.stroke()}x.strokeStyle='#6d4b2a';x.lineWidth=3;x.beginPath();x.moveTo(-18,14);x.lineTo(-12,40);x.moveTo(18,14);x.lineTo(12,40);x.stroke();x.fillStyle='#7c4d2a';x.fillRect(-17,38,34,20);x.restore();requestAnimationFrame(draw)}draw();setTimeout(()=>{let e=document.getElementById('instr');if(e)e.textContent='Steady attention lifts you higher.'},6000)}
function mentalGym(){let c=gameShell('FITNESS · FITNESS','Build and hold your mental power.');let x=c.getContext('2d'),w,h,t=0;function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();onresize=resize;function draw(){t+=.014;let power=.62+.27*Math.sin(t*.48)+.08*Math.sin(t*2);let gr=x.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#071d2b');gr.addColorStop(.55,'#0b3c46');gr.addColorStop(1,'#06231f');x.fillStyle=gr;x.fillRect(0,0,w,h);x.strokeStyle='#56f1d322';for(let i=0;i<18;i++){x.beginPath();x.moveTo(i*w/18,0);x.lineTo(w/2,h*.72);x.stroke()}let y=h*.72-power*h*.34;x.shadowBlur=55;x.shadowColor='#52f4d7';let rg=x.createRadialGradient(w/2-15,y-15,5,w/2,y,75);rg.addColorStop(0,'#fff');rg.addColorStop(.18,'#7effe8');rg.addColorStop(.55,'#0fc5bb');rg.addColorStop(1,'#0a577000');x.fillStyle=rg;x.beginPath();x.arc(w/2,y,80,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#dffbf6';x.font='700 22px system-ui';x.textAlign='center';x.fillText(Math.round(power*100)+' '+nGT('POWER'),w/2,y+7);x.strokeStyle='#7ffbe555';x.lineWidth=3;for(let i=0;i<4;i++){x.beginPath();x.ellipse(w/2,h*.76,120+i*65,24+i*12,0,0,7);x.stroke()}requestAnimationFrame(draw)}draw();setTimeout(()=>{let e=document.getElementById('instr');if(e)e.textContent='Hold the state. Complete the set.'},6000)}
function endGame(){document.getElementById('game').classList.add('hidden');document.getElementById('game').innerHTML='';let rt=S.rts.length?Math.round(S.rts.reduce((a,b)=>a+b,0)/S.rts.length):418;document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">Session ${S.session} of ${S.totalSessions} complete</div><h2>You are improving.</h2><div class="grid2"><div class="deltaHero"><span class="mini">YOUR PERSONAL DELTA</span><div class="delta">+37%</div><h3>more time in your target state</h3><p>compared with your first session.</p><div class="compare"><div class="compareRow"><b>Session 1</b><div class="compareTrack"><div class="compareFill" style="width:42%"></div></div><b>42%</b></div><div class="compareRow"><b>Today</b><div class="compareTrack"><div class="compareFill" style="width:59%"></div></div><b>59%</b></div></div></div><div class="card" style="cursor:default"><span class="num">DIFFICULTY-ADJUSTED PROGRESS</span><h3>Improved at a harder level.</h3><p>Today's difficulty was <b>Level ${S.difficulty}</b>, up from Level 1. Results are shown alongside the adaptive level, so difficulty and performance can be read separately.</p><div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><span class="mini">RECOVERY</span><b>−18%</b></div><div class="metric"><span class="mini">DIFFICULTY</span><b>+2</b></div></div></div></div><div class="programHero"><span class="mini" style="color:#bdece8">YOUR PROGRAM</span><h3>Session ${S.session} of ${S.totalSessions}</h3>${programDots()}<p>Early win achieved. Next session: maintain the state as the challenge increases gradually.</p></div><div class="row" style="margin-top:25px"><button class="cta" onclick="sessionReport()">VIEW SESSION REPORT</button><button class="cta ghost" onclick="go('progress')">VIEW PROGRESS</button><button class="cta ghost" onclick="go('home')">BACK HOME</button></div></section>`}
function sessionReport(){document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">Report · Session ${S.session}/${S.totalSessions}</div><h2>Your session report</h2><div class="reportSheet"><span class="productTag">Participant report</span><h3 style="font-size:30px;margin-top:20px">${S.training||'Deep Focus'} · Personal progress</h3><div class="metrics"><div class="metric"><span class="mini">TARGET-STATE DELTA</span><b>+37%</b></div><div class="metric"><span class="mini">RECOVERY</span><b>−18%</b></div><div class="metric"><span class="mini">DIFFICULTY</span><b>L3</b></div><div class="metric"><span class="mini">PROGRAM</span><b>${S.session}/8</b></div></div><h3>What changed</h3><p>You spent more time in the target state than in Session 1, despite training at a higher difficulty. Your recovery after distraction was also faster.</p><h3>Next objective</h3><p>Maintain the same stability as the adaptive challenge increases gradually.</p></div><div class="row" style="margin-top:24px"><button class="cta" onclick="window.print()">EXPORT / PRINT REPORT</button><button class="cta ghost" onclick="go('progress')">PROGRAM PROGRESS</button></div></section>`}
function progress(){return `<section class="wrap"><div class="eyebrow">Track · ${S.segment}</div><h2>Your progress is measured against you.</h2><p class="lead">Personal change from Session 1 remains visible even when adaptive difficulty increases.</p><div class="programHero"><span class="mini" style="color:#bdece8">8-SESSION PROGRAM</span><h3>Session ${S.session} of ${S.totalSessions}</h3>${programDots()}<p>Next milestone: Session 4 · stable performance at increased difficulty.</p></div><div class="grid2"><div class="deltaHero"><span class="mini">FOCUS · VS SESSION 1</span><div class="delta">+37%</div><p>Target-state maintenance</p></div><div class="deltaHero"><span class="mini">REGULATION · VS SESSION 1</span><div class="delta">+28%</div><p>Difficulty-adjusted stability</p></div></div><h3 style="margin-top:34px">Personal progression</h3><div class="compare"><div class="compareRow"><b>S1</b><div class="compareTrack"><div class="compareFill" style="width:42%"></div></div><b>Baseline</b></div><div class="compareRow"><b>S2</b><div class="compareTrack"><div class="compareFill" style="width:59%"></div></div><b>+37%</b></div><div class="compareRow"><b>S3</b><div class="compareTrack"><div class="compareFill" style="width:67%"></div></div><b>+60%</b></div></div><div class="metrics"><div class="metric"><span class="mini">ATTENDANCE</span><b>3/3</b></div><div class="metric"><span class="mini">DIFFICULTY</span><b>1→3</b></div><div class="metric"><span class="mini">FASTEST GROWTH</span><b style="font-size:22px">Focus</b></div><div class="metric"><span class="mini">NEXT</span><b style="font-size:22px">Session 4</b></div></div><button class="cta" onclick="finalReport()">PREVIEW FINAL REPORT</button></section>`}
function finalReport(){document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">Program report</div><h2>Your Neroes journey</h2><div class="reportSheet"><span class="productTag">8-session final report preview</span><h3 style="font-size:30px;margin-top:20px">Progress that is easy to understand and share.</h3><div class="metrics"><div class="metric"><span class="mini">ATTENTION STABILITY</span><b>+46%</b></div><div class="metric"><span class="mini">RECOVERY TIME</span><b>−31%</b></div><div class="metric"><span class="mini">TARGET MAINTENANCE</span><b>+28%</b></div><div class="metric"><span class="mini">DIFFICULTY</span><b>1→6</b></div></div><p>Reports distinguish personal improvement from game difficulty and summarize attendance, learning progression and relevant session outcomes.</p></div><div class="row" style="margin-top:24px"><button class="cta" onclick="window.print()">EXPORT REPORT</button><button class="cta ghost" onclick="go('progress')">BACK</button></div></section>`}
function operatorView(){document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">Neroes Operator</div><h2>Who needs attention today?</h2><p class="lead">A simple operational view for trained staff in companies, schools, clinics and fitness environments.</p><div class="metrics"><div class="metric"><span class="mini">TODAY</span><b>24</b></div><div class="metric"><span class="mini">COMPLETED</span><b>18</b></div><div class="metric"><span class="mini">UPCOMING</span><b>3</b></div><div class="metric"><span class="mini">NEEDS ATTENTION</span><b>3</b></div></div><table class="opTable"><thead><tr><th>PARTICIPANT</th><th>PROGRAM</th><th>STATUS</th><th>NEXT ACTION</th></tr></thead><tbody><tr><td><b>Maria Silva</b></td><td>Session 3/8</td><td><span class="attention">Missed 2 sessions</span></td><td>Contact participant</td></tr><tr><td><b>João Costa</b></td><td>Session 2/8</td><td><span class="attention">Low perceived progress</span></td><td>Review early-win settings</td></tr><tr><td><b>Ana Martins</b></td><td>Session 4/8</td><td><span class="attention">Signal issue ×2</span></td><td>Check headset fit</td></tr><tr><td><b>Miguel Santos</b></td><td>Session 7/8</td><td><span class="attention good">On track</span></td><td>Final report next</td></tr></tbody></table><div class="grid2"><div class="card" onclick="signalRecovery()"><span class="num">OPERATOR TOOL</span><h3>Signal recovery guide</h3><p>See how the software degrades safely when sensor quality fails.</p></div><div class="card" onclick="finalReport()"><span class="num">REPORTING</span><h3>Program reports</h3><p>Participant session reports and final buyer-ready program outputs.</p></div></div></section>`}

function toggleSound(){try{if(!_audio.ctx)_audio.ctx=new (window.AudioContext||window.webkitAudioContext)();_audio.on=!_audio.on;let b=document.getElementById('soundToggle');if(b){b.textContent=_audio.on?'Sound on':'Sound off';b.classList.toggle('on',_audio.on)}if(_audio.on){_audio.osc=_audio.ctx.createOscillator();_audio.gain=_audio.ctx.createGain();_audio.osc.type='sine';_audio.osc.frequency.value=110;_audio.gain.gain.value=.018;_audio.osc.connect(_audio.gain).connect(_audio.ctx.destination);_audio.osc.start()}else stopAudio()}catch(e){}}

function rewardTone(level=1){if(!_audio.on||!_audio.ctx)return;let o=_audio.ctx.createOscillator(),g=_audio.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(440+level*90,_audio.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(650+level*110,_audio.ctx.currentTime+.18);g.gain.setValueAtTime(.001,_audio.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.07,_audio.ctx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.001,_audio.ctx.currentTime+.32);o.connect(g).connect(_audio.ctx.destination);o.start();o.stop(_audio.ctx.currentTime+.34)}

// Richer pseudo-3D Space Flight with gates, planets, depth and reward portals.
neuralFlight=function(){let c=gameShell('DEEP FOCUS · SPACE FLIGHT','Stay with the flight path.');let x=c.getContext('2d'),w,h,t=0;let stars=Array.from({length:420},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),s:.4+Math.random()*1.8}));function rz(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight}rz();window.onresize=rz;function ship(cx,cy,f){x.save();x.translate(cx,cy);x.shadowBlur=28;x.shadowColor='#52f8ff';let grd=x.createLinearGradient(0,-35,0,38);grd.addColorStop(0,'#f6ffff');grd.addColorStop(.55,'#8fe9ef');grd.addColorStop(1,'#176b91');x.fillStyle=grd;x.beginPath();x.moveTo(0,-38);x.lineTo(34,24);x.lineTo(11,17);x.lineTo(0,38);x.lineTo(-11,17);x.lineTo(-34,24);x.closePath();x.fill();x.fillStyle='#47f5e4';x.beginPath();x.moveTo(-9,27);x.lineTo(0,78+f*28);x.lineTo(9,27);x.closePath();x.fill();x.restore()}function draw(){t+=.012;let f=.74+.15*Math.sin(t*.55)+.05*Math.sin(t*2.2);let bg=x.createRadialGradient(w*.5,h*.43,0,w*.5,h*.43,Math.max(w,h)*.75);bg.addColorStop(0,'#154f72');bg.addColorStop(.28,'#09233e');bg.addColorStop(1,'#01040b');x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle='#5ac7df18';x.beginPath();x.arc(w*.18,h*.25,90,0,7);x.fill();x.fillStyle='#8b79d820';x.beginPath();x.arc(w*.84,h*.35,140,0,7);x.fill();stars.forEach(p=>{p.z-=.007+.018*f;if(p.z<.02){p.z=1;p.x=(Math.random()-.5)*2;p.y=(Math.random()-.5)*2}let scale=1/p.z,px=w/2+p.x*w*.38*scale,py=h*.43+p.y*h*.34*scale;if(px<0||px>w||py<0||py>h)return;x.globalAlpha=Math.min(1,(1-p.z)*1.6);x.fillStyle='#dffcff';x.beginPath();x.arc(px,py,Math.min(4,p.s*scale),0,7);x.fill()});x.globalAlpha=1;for(let k=0;k<4;k++){let z=((t*.18+k*.25)%1),r=18+z*Math.min(w,h)*.44;x.strokeStyle=`rgba(72,238,231,${.12+.35*(1-z)})`;x.lineWidth=2+4*(1-z);x.beginPath();x.ellipse(w/2,h*.43,r*1.7,r*.58,0,0,7);x.stroke()}let wob=(1-f)*30*Math.sin(t*9);ship(w/2+wob,h*.74,f);x.fillStyle='#ffffffaa';x <script id="v87-clarity-flow">
const V87_HOW_IMG='assets/image-2.png';
function v87Duration(raw){return String(raw||'').split('·')[0].trim();}
function v87Radar(pt){
 const labels=pt?['Foco','Regulação','Memória','Reação','Controlo','Decisão']:['Focus','Regulation','Memory','Reaction','Control','Decision'];
 const vals=[78,69,64,82,72,67], cx=160,cy=160,R=105,n=6;
 const point=(r,i)=>{let a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 let grids=[.25,.5,.75,1].map(k=>`<polygon class="grid" points="${[0,1,2,3,4,5].map(i=>point(R*k,i).join(',')).join(' ')}"/>`).join('');
 let axes=[0,1,2,3,4,5].map(i=>{let p=point(R,i);return `<line class="axis" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`}).join('');
 let pts=vals.map((v,i)=>point(R*v/100,i));
 let dots=pts.map(p=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('');
 let texts=labels.map((l,i)=>{let p=point(R+30,i);let anchor=p[0]<cx-5?'end':p[0]>cx+5?'start':'middle';return `<text x="${p[0]}" y="${p[1]+4}" text-anchor="${anchor}">${l}</text>`}).join('');
 return `<svg class="v87Radar" viewBox="0 0 320 320" role="img" aria-label="Mental abilities profile">${grids}${axes}<polygon class="shape" points="${pts.join(' ')}"/>${dots}${texts}</svg>`;
}
/* Brain Check is presented as an available 5-minute experience, with an explicitly simulated concept result. */
measure=function(){let c=V83[S.lang],pt=S.lang==='PT';return `<section class="wrap"><button class="v83TextBtn v83Back" onclick="go('home')">${c.back}</button><div class="v83Measure">${v84Mat('live')}<div class="eyebrow">BRAIN CHECK · 5 MIN</div><h2>${pt?'Uma fotografia rápida das tuas capacidades mentais.':'A quick snapshot of your mental abilities.'}</h2><p class="lead" style="margin:0 auto">${pt?'Liga o headset, faz uma análise guiada de 5 minutos e recebe um perfil visual para acompanhar ao longo do tempo.':'Connect the headset, complete a guided 5-minute check and receive a visual profile you can track over time.'}</p><div class="v83MeasureSteps"><i class="on"></i><i></i><i></i><i></i></div><div class="ring"><b>96%</b></div><h3>${c.connected} ✓</h3><p>${c.signal}</p><button class="cta" style="margin-top:18px" onclick="braincheck()">${pt?'INICIAR · 5 MIN':'START · 5 MIN'}</button></div></section>`};
brainCheckProduct=function(){
 const pt=S.lang==='PT',m=document.getElementById('main');m.dataset.view='braincheckproduct';
 m.innerHTML=`<section class="v84Panel"><button class="v83TextBtn" onclick="go('measure')">← Brain Check</button><div class="v87BrainIntro">${v84Mat('live')}<div class="eyebrow">BRAIN CHECK · 5 MIN</div><h2>${pt?'5 minutos. Um perfil visual do teu ponto de partida.':'5 minutes. A visual profile of your starting point.'}</h2><p class="lead">${pt?'Uma análise guiada cria uma referência pessoal que podes voltar a medir e comparar.':'A guided check creates a personal reference you can measure again and compare over time.'}</p><div class="v87BrainFlow"><div><b>1 · ${pt?'Ligar':'Connect'}</b><span>${pt?'Confirmamos a qualidade do sinal.':'We confirm signal quality.'}</span></div><div><b>2 · ${pt?'Analisar · 5 min':'Check · 5 min'}</b><span>${pt?'Tarefas curtas e guiadas.':'Short guided tasks.'}</span></div><div><b>3 · ${pt?'Ver perfil':'See your profile'}</b><span>${pt?'Resultado visual e fácil de comparar.':'A visual result that is easy to compare.'}</span></div></div></div><div class="v87RadarWrap"><div>${v87Radar(pt)}</div><div class="v87BrainRead"><div class="eyebrow">${pt?'EXEMPLO DE RESULTADO':'EXAMPLE RESULT'}</div><h3>${pt?'O teu perfil de capacidades mentais':'Your mental abilities profile'}</h3><p>${pt?'Vê rapidamente onde estás hoje e usa futuras medições para perceber a mudança.':'See where you are today and use future checks to understand change.'}</p><div class="v87Key"><span>${pt?'Ponto mais forte':'Strongest today'}</span><b>${pt?'Reação':'Reaction'}</b></div><div class="v87Key"><span>${pt?'Área a acompanhar':'Area to watch'}</span><b>${pt?'Memória de trabalho':'Working memory'}</b></div><p class="v87Concept">${pt?'Dados simulados para demonstrar a interface. As dimensões apresentadas são um conceito de produto e devem corresponder apenas a métricas que a Neroes consiga efetivamente suportar.':'Simulated data to demonstrate the interface. The dimensions shown are a product concept and should only map to metrics Neroes can actually support.'}</p></div></div><div class="v84CtaRow"><button class="cta" onclick="braincheck()">${pt?'FAZER BRAIN CHECK':'START BRAIN CHECK'}</button><button class="cta ghost" onclick="individualReport()">${pt?'VER RELATÓRIO EXEMPLO':'VIEW EXAMPLE REPORT'}</button></div></section>`;v84Top();
};
individualReport=function(){
 const pt=S.lang==='PT',m=document.getElementById('main');m.dataset.view='individualreport';
 m.innerHTML=`<section class="v84Panel v86Report">${v86Back("brainCheckProduct()",'Brain Check')}<div class="v86Topline"><div><div class="eyebrow">${pt?'BRAIN CHECK · RESULTADO':'BRAIN CHECK · RESULT'}</div><h2>${pt?'O teu perfil de hoje':'Your profile today'}</h2></div>${v84Mat('live')}</div><div class="reportSheet"><div class="v86ReportCard"><div class="v87RadarWrap" style="margin:0;border:0;padding:0;background:transparent"><div>${v87Radar(pt)}</div><div class="v87BrainRead"><h3>${pt?'Leitura rápida':'Quick read'}</h3><div class="v87Key"><span>${pt?'Reação':'Reaction'}</span><b>82</b></div><div class="v87Key"><span>${pt?'Foco':'Focus'}</span><b>78</b></div><div class="v87Key"><span>${pt?'Controlo cognitivo':'Cognitive control'}</span><b>72</b></div><p>${pt?'O valor desta medição torna-se a tua referência para futuras comparações.':'This check becomes your reference for future comparisons.'}</p></div></div></div></div><div class="v84CtaRow"><button class="cta" onclick="window.print()">${pt?'EXPORTAR':'EXPORT'}</button><button class="cta ghost" onclick="go('train')">${pt?'ESCOLHER TREINO':'CHOOSE TRAINING'}</button></div></section>`;v84Top();
};
/* Remove internal difficulty codes from participant-facing training cards. */
train=function(){let c=V83[S.lang],arr=V84_TRAIN[S.segment]||V84_TRAIN.Corporate,pt=S.lang==='PT';return `<section class="wrap"><button class="v83TextBtn v83Back" onclick="go('home')">${c.back}</button><div class="v83TrainIntro"><div class="eyebrow">${S.segment}</div><h2>${c.trainTitle}</h2><p class="lead">${pt?'Escolhe o que queres treinar. A Neroes ajusta a dificuldade durante a experiência.':'Choose what you want to train. Neroes adjusts the challenge during the experience.'}</p></div><div class="v83TrainGrid">${arr.map(a=>`<div class="v83TrainCard" onclick="selectTraining('${a[0].replace(/'/g,"\'")}')">${v84Mat(a[3])}<div><h3>${pt?(V84_PT_NAMES[a[0]]||a[0]):a[0]}</h3><p>${a[0]==='Recovery Control'?(pt?'Treina a capacidade de voltar a um estado calmo e preparado depois de esforço mental.':'Train your ability to return to a calm, ready state after mental effort.'):a[1]}</p></div><span class="dur">${v87Duration(a[2])}</span></div>`).join('')}</div></section>`};
/* Replace participant-facing 'Recovery Control' label with a meaningful outcome. */
const _v87selectTraining=selectTraining;
selectTraining=function(name){if(name==='Recovery Control')name='Recovery Control';return _v87selectTraining(name)};
/* Final report: no L1/L3/L6 internal codes. */
finalReport=function(){
 const pt=S.lang==='PT',m=document.getElementById('main');m.dataset.view='finalreport';m.innerHTML=`<section class="v84Panel v86Report">${v86Back("go('progress')",pt?'Progresso':'Progress')}<div class="v86Topline"><div><div class="eyebrow">${pt?'RELATÓRIO FINAL · 8 SESSÕES':'FINAL REPORT · 8 SESSIONS'}</div><h2>${pt?'A tua evolução ao longo do programa':'Your change across the programme'}</h2></div></div><div class="reportSheet"><div class="v86ReportCard"><div class="v86MetricGrid"><div class="v86Metric"><span>${pt?'TEMPO NO ESTADO-ALVO':'TARGET-STATE TIME'}</span><b>+37%</b><small>${pt?'vs. primeira sessão':'vs. first session'}</small></div><div class="v86Metric"><span>${pt?'VOLTAR AO FOCO':'RETURN TO FOCUS'}</span><b>−31%</b><small>${pt?'menos tempo após distração':'less time after disruption'}</small></div><div class="v86Metric"><span>${pt?'PROGRAMA':'PROGRAMME'}</span><b>8/8</b><small>${pt?'sessões concluídas':'sessions completed'}</small></div></div><div class="v86SectionTitle">${pt?'EVOLUÇÃO ENTRE SESSÕES':'CHANGE ACROSS SESSIONS'}</div><div class="v86Trend">${[28,34,39,46,54,61,68,78].map(v=>`<i style="height:${v}%"></i>`).join('')}</div><div class="v86Row"><span>${pt?'Referência inicial':'Starting reference'}</span><b>${pt?'Sessão 1':'Session 1'}</b></div><div class="v86Row"><span>${pt?'Desafio':'Challenge'}</span><b>${pt?'Aumentou progressivamente':'Increased progressively'}</b></div><div class="v86Row"><span>${pt?'O que isto significa':'What this means'}</span><b>${pt?'Conseguiste manter o desempenho com maior desafio':'You maintained performance as challenge increased'}</b></div></div></div><div class="v84CtaRow"><button class="cta" onclick="window.print()">${pt?'EXPORTAR RELATÓRIO':'EXPORT REPORT'}</button></div></section>`;v84Top();
};
/* Concrete visual complements the circular explanation. */
const _v87HowBase=howItWorks;
howItWorks=function(){
 _v87HowBase(); const pt=S.lang==='PT',main=document.getElementById('main'); if(!main)return;
 const target=main.querySelector('.v84Active')||main.querySelector('.v84Research')||main.lastElementChild;
 const visual=document.createElement('div');visual.className='v87HowVisual';visual.innerHTML=`<img src="${V87_HOW_IMG}" alt="${pt?'Exemplo visual de uma experiência de neurofeedback controlada pela atividade cerebral':'Visual example of a neurofeedback experience controlled by brain activity'}"><div class="v87HowCaption"><b>${pt?'Tu fazes o treino. O jogo responde ao teu cérebro.':'You do the training. The game responds to your brain.'}</b><span>${pt?'A atividade cerebral é lida em tempo real e a experiência muda como feedback.':'Brain activity is read in real time and the experience changes as feedback.'}</span></div>`;
 if(target&&target.parentNode)target.parentNode.insertBefore(visual,target);else main.appendChild(visual);v84Top();
};
</script>

<script id="v88-flow">
function v88Radar(pt){
 const labels=pt?['Foco','Regulação','Memória','Reação','Controlo','Decisão']:['Focus','Regulation','Memory','Reaction','Control','Decision'];
 const base=[56,52,49,61,54,50], now=[78,69,64,82,72,68], cx=250,cy=220,R=155;
 const ptAt=(i,val)=>{const a=(-Math.PI/2)+(i*Math.PI*2/6),r=R*val/100;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 const poly=arr=>arr.map((v,i)=>ptAt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
 let grids='';[20,40,60,80,100].forEach(v=>{let p=Array.from({length:6},(_,i)=>ptAt(i,v).join(',')).join(' ');grids+=`<polygon points="${p}" fill="none" stroke="rgba(255,255,255,.13)"/>`});
 let axes='',labs='';labels.forEach((l,i)=>{let p=ptAt(i,100), q=ptAt(i,116);axes+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="rgba(255,255,255,.12)"/>`;labs+=`<text x="${q[0]}" y="${q[1]}" fill="#dbe6ea" font-size="13" font-weight="800" text-anchor="middle" dominant-baseline="middle">${l}</text>`});
 return `<svg viewBox="0 0 500 440" role="img" aria-label="${pt?'Comparação entre referência inicial e estado atual':'Comparison of starting baseline and current profile'}">${grids}${axes}<polygon points="${poly(base)}" fill="rgba(79,168,255,.12)" stroke="#4fa8ff" stroke-width="3"/><polygon points="${poly(now)}" fill="rgba(255,95,162,.18)" stroke="#ff5fa2" stroke-width="3"/>${base.map((v,i)=>{let p=ptAt(i,v);return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#4fa8ff"/>`}).join('')}${now.map((v,i)=>{let p=ptAt(i,v);return `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#ff5fa2"/>`}).join('')}${labs}</svg>`;
}
assessment=function(){
 const pt=S.lang==='PT',m=document.getElementById('main');let pct=0;
 m.innerHTML=`<section class="wrap"><button class="v83TextBtn v83Back" onclick="go('measure')">← ${pt?'Voltar':'Back'}</button><div class="v88Measure"><div class="eyebrow">BRAIN CHECK · 5 MIN</div><h2>${pt?'A medir o teu perfil':'Measuring your profile'}</h2><p id="v88status">${pt?'A analisar o sinal e a resposta às tarefas guiadas…':'Analysing signal and responses to guided tasks…'}</p><div class="v88EEG"><svg viewBox="0 0 1200 150" preserveAspectRatio="none"><polyline points="0,76 45,76 60,72 70,83 82,38 95,112 110,68 130,76 190,76 220,72 232,83 244,40 258,108 274,69 300,76 360,76 390,71 402,82 414,35 430,114 446,68 470,76 530,76 560,72 572,84 585,42 600,105 616,70 640,76 700,76 730,71 742,82 755,36 770,112 786,68 810,76 870,76 900,72 912,83 925,40 940,108 956,69 980,76 1040,76 1070,71 1082,82 1095,35 1110,114 1126,68 1150,76 1200,76"/></svg><div class="v88Scan"></div></div><div class="v88ProgressTrack"><div class="v88ProgressFill" id="v88fill"></div></div><div class="v88MeasureMeta"><span id="v88pct">0%</span><span>${pt?'Sinal · Excelente':'Signal · Excellent'}</span></div><button class="cta" id="v88result" style="display:none;margin-top:28px">${pt?'VER RESULTADO':'VIEW RESULT'}</button></div></section>`;
 v84Top();
 const timer=setInterval(()=>{pct=Math.min(100,pct+4);let f=document.getElementById('v88fill'),p=document.getElementById('v88pct');if(f)f.style.width=pct+'%';if(p)p.textContent=pct+'%';if(pct>=100){clearInterval(timer);let st=document.getElementById('v88status'),b=document.getElementById('v88result');if(st){st.textContent=pt?'Medição concluída. O teu perfil está pronto.':'Measurement complete. Your profile is ready.';st.className='v88Done'}if(b){b.style.display='inline-flex';b.onclick=()=>results(true)}}},120);
};
progress=function(){

:'The chart always compares you with your own baseline, not with other people.'}</p></div><button class="cta" onclick="finalReport()">${pt?'PRÉ-VISUALIZAR RELATÓRIO FINAL':'PREVIEW FINAL REPORT'}</button></section>`;
};
</script>

function v89Radar(mode='baseline'){

 const ptAt=(i,v)=>{let a=-Math.PI/2+i*Math.PI/3,r=R*v/100;return `${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`};
 const ring=v=>labels.map((_,i)=>ptAt(i,v)).join(' '),bp=base.map((v,i)=>ptAt(i,v)).join(' '),np=now.map((v,i)=>ptAt(i,v)).join(' ');

}
function participantProfile(){
 const pt=S.lang==='PT';document.getElementById('main').dataset.view='profile';document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">${pt?'PERFIL':'PROFILE'}</div><h2>${pt?'O teu perfil de performance mental':'Your brain performance profile'}</h2><p class="lead">${pt?'Este perfil é uma referência pessoal. Não é uma nota de 0–100, não existe um valor “bom” universal e não é comparado com outras pessoas.':'This profile is a personal reference. It is not a 0–100 grade, there is no universal “good” value, and you are not compared with other people.'}</p><div class="v89ProfileTop"><div class="v89ProfileRadar">${v89Radar('baseline')}</div><div><div class="v89Explain"><b>${pt?'Como ler isto':'How to read this'}</b><br>${pt?'A forma mostra o teu ponto de partida relativo nas diferentes capacidades avaliadas. O valor útil aparece ao longo do tempo: onde começaste e como o teu próprio perfil muda com treino consistente.':'The shape shows your relative starting reference across the abilities assessed. The useful information appears over time: where you started and how your own profile changes with consistent training.'}</div><div class="v89AbilityList"><div class="v89Ability"><span>${pt?'Foco':'Focus'}</span><em>${pt?'referência definida':'reference set'}</em></div><div class="v89Ability"><span>${pt?'Regulação':'Regulation'}</span><em>${pt?'referência definida':'reference set'}</em></div><div class="v89Ability"><span>${pt?'Memória':'Memory'}</span><em>${pt?'referência definida':'reference set'}</em></div><div class="v89Ability"><span>${pt?'Reação':'Reaction'}</span><em>${pt?'referência definida':'reference set'}</em></div><div class="v89Ability"><span>${pt?'Controlo':'Control'}</span><em>${pt?'referência definida':'reference set'}</em></div><div class="v89Ability"><span>${pt?'Decisão':'Decision'}</span><em>${pt?'referência definida':'reference set'}</em></div></div></div></div><div class="v83Recommend" style="margin-top:28px"><div><span class="mini">${pt?'PRÓXIMO PASSO':'NEXT STEP'}</span><h3>${pt?'Tudo pronto para a próxima sessão.':'Ready for your next session.'}</h3><p>${pt?'O treino seguinte trabalha uma capacidade específica. O progresso do perfil é revisto após um bloco consistente de sessões — não depois de um único jogo.':'Your next training targets one specific ability. Profile progress is reviewed after a consistent block of sessions — not after a single game.'}</p></div><button class="cta" onclick="go('train')">${pt?'TREINAR':'TRAIN'}</button></div></section>`;v84Top();
}
function organizationView(){
 const pt=S.lang==='PT';document.getElementById('main').dataset.view='organization';document.getElementById('main').innerHTML=`<section class="wrap"><div class="eyebrow">${pt?'ORGANIZAÇÃO · VISÃO AGREGADA':'ORGANIZATION · AGGREGATE VIEW'}</div><h2>${pt?'Programa da organização':'Organization programme'}</h2><div class="v89Privacy"><b>${pt?'Privacidade por desenho.':'Privacy by design.'}</b> ${pt?'A organização vê participação e resultados agregados do grupo. Não vê perfis individuais, resultados pessoais nem quem “evoluiu mais”.':'The organization sees participation and aggregate group outcomes. It does not see individual profiles, personal results, or who “improved most”.'}</div><div class="v89OrgGrid"><div class="v89Kpi"><span>${pt?'PARTICIPANTES ATIVOS':'ACTIVE PARTICIPANTS'}</span><b>24</b><small>${pt?'no programa':'in programme'}</small></div><div class="v89Kpi"><span>${pt?'SESSÕES CONCLUÍDAS':'SESSIONS COMPLETED'}</span><b>168</b><small>${pt?'total agregado':'aggregate total'}</small></div><div class="v89Kpi"><span>${pt?'A CAMINHO DE CONCLUIR':'ON TRACK TO COMPLETE'}</span><b>79%</b><small>${pt?'com base na participação':'based on participation'}</small></div></div><div class="v89SummaryGrid"><div class="v89Card"><div class="eyebrow">${pt?'ADESÃO':'ENGAGEMENT'}</div><h3>${pt?'Treinos por semana':'Training sessions per week'}</h3><div class="v86Trend" style="height:150px">${[42,58,64,71,69,77,82,78].map(v=>`<i style="height:${v}%"></i>`).join('')}</div><p>${pt?'Tendência agregada do grupo; sem identificação individual.':'Aggregate group trend; no individual identification.'}</p></div><div class="v89Card"><div class="eyebrow">${pt?'RESULTADO DO GRUPO':'GROUP OUTCOME'}</div><h3>${pt?'Mudança agregada':'Aggregate change'}</h3><p>${pt?'Mostrar apenas métricas que possam ser agregadas de forma válida e com dimensão de grupo suficiente. Nenhum perfil individual é exposto.':'Only metrics that can be validly aggregated and have sufficient group size should be shown. No }

ol'}</span><em>↑ ${pt?'vs. início':'vs. start'}</em></div><div class="v89Ability"><span>${pt?'Decisão':'Decision'}</span><em>↑ ${pt?'vs. início':'vs. start'}</em></div></div></div></div></div><div class="v89Card"><div class="eyebrow">${pt?'CONSISTÊNCIA':'CONSISTENCY'}</div><h3>${pt?'10 sessões concluídas':'10 sessions completed'}</h3><p>${pt?'O perfil é revisto em checkpoints do programa. O resultado de cada jogo continua específico à capacidade treinada nessa sessão.':'The profile is reviewed at programme checkpoints. Each game result remains specific to the ability trained in that session.'}</p></div></section>`};
// Final report becomes an in-app summary, no export, with trials explicitly labelled.
finalReport=function(){let pt=S.lang==='PT';document.getElementById('main').dataset.view='finalreport';document.getElementById('main').innerHTML=`<section class="wrap"><button class="v83TextBtn v83Back" onclick="go('progress')">← ${pt?'Voltar':'Back'}</button><div class="eyebrow">${pt?'RESUMO · 10 SESSÕES':'SUMMARY · 10 SESSIONS'}</div><h2>${pt?'O que mudou ao longo do treino':'What changed across training'}</h2><div class="v89Card"><h3>${pt?'Desempenho dentro de uma capacidade treinada':'Performance within a trained ability'}</h3><p>${pt?'Cada barra representa um trial/subsessão dentro do jogo — não uma capacidade mental diferente.':'Each bar represents a trial/sub-session within the game — not a different mental ability.'}</p><div class="v89Trials">${[42,48,52,56,61,64,68,66,72,76].map((v,i)=>`<div class="v89Trial" style="height:${v}%"><span>${pt?'Trial':'Trial'} ${i+1}</span></div>`).join('')}</div><p class="v89Note">${pt?'Isto mostra como o participante respondeu dentro desta sessão. A mudança do perfil global é avaliada separadamente após treino consistente.':'This shows how the participant responded within this session. Change in the overall profile is assessed separately after consistent training.'}</p></div><div class="v88RadarCard"><div class="v88RadarGrid"><div><div class="v88Legend"><span class="base"><i></i>${pt?'Onde começaste':'Where you started'}</span><span class="now"><i></i>${pt?'Após 10 sessões':'After 10 sessions'}</span></div>${v89Radar('compare')}</div><div class="v88Readout"><h3>${pt?'Perfil ao longo do programa':'Profile across the programme'}</h3><div class="v89Explain">${pt?'A sobreposição mostra direção de mudança relativamente à tua própria referência. Não é uma nota absoluta e não define “bom” ou “mau”.':'The overlay shows direction of change relative to your own reference. It is not an absolute grade and does not define “good” or “bad”.'}</div></div></div></div></section>`;v84Top()};

rso do participante. A organização recebe apenas informação agregada e anonimizada, sujeita à governação e consentimento do programa.':'Individual data belongs to the participant journey. The organization receives aggregate, anonymized information only, subject to programme governance and consent.'}</p></div><div class="v89Card"><h3>${pt?'No final':'At the end'}</h3><p>${pt?'O participante vê a mudança do seu perfil face ao ponto de partida; a organização recebe um resumo agregado do programa.':'The participant sees how their profile changed from their starting point; the organization receives an aggregate programme summary.'}</p></div></div></section>`;v84Top()};

/* The animated closed loop. Nodes sit on the circumference of the ring
   (regular pentagon), so the diagram holds together at any width. */
.n-how .nfLoopV82{
  width:640px!important;max-width:100%!important;height:566px!important;aspect-ratio:auto!important;
  margin:28px auto 22px!important;position:relative;
}
.n-how .nfLoopV82 .orbit{
  position:absolute;width:400px;height:400px;
  left:50%;top:50%;transform:translate(-50%,-50%);
  border:1px solid rgba(69,226,210,.28);border-radius:50%;
  box-shadow:inset 0 0 70px rgba(69,226,210,.05);
}
.n-how .nfLoopV82 .orbit:after{
  content:"";position:absolute;width:12px;height:12px;border-radius:50%;
  background:var(--n-accent);box-shadow:0 0 22px var(--n-accent);
  left:50%;top:-6px;margin-left:-6px;transform-origin:6px 206px;
  animation:signalOrbit 5s linear infinite;
}
.n-how .nfLoopV82 .core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:186px;height:186px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:16px;box-sizing:border-box;
  background:radial-gradient(circle,rgba(69,226,210,.16),rgba(255,255,255,.02));
  border:1px solid rgba(69,226,210,.3);box-shadow:0 0 70px rgba(69,226,210,.09);
}
.n-how .nfLoopV82 .core b{font-size:12px;letter-spacing:.1em;line-height:1.35;color:#fff!important}
.n-how .nfLoopV82 .core span{font-size:10.5px;color:var(--n-muted)!important;margin-top:8px;line-height:1.4}
.n-how .nfLoopV82 .loopNode{
  position:absolute;left:50%;top:50%;width:150px;text-align:center;
}
.n-how .nfLoopV82 .loopNode i{
  display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.12em;
  color:var(--n-accent)!important;margin-bottom:4px;opacity:.85;
}
.n-how .nfLoopV82 .loopNode b{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#fff!important}
.n-how .nfLoopV82 .loopNode p{font-size:12px;color:var(--n-muted)!important;margin:5px 0 0;line-height:1.45}
.n-how .ln1{transform:translate(-50%,-50%) translate(0,-258px)}
.n-how .ln2{transform:translate(-50%,-50%) translate(245px,-80px)}
.n-how .ln3{transform:translate(-50%,-50%) translate(152px,209px)}
.n-how .ln4{transform:translate(-50%,-50%) translate(-152px,209px)}
.n-how .ln5{transform:translate(-50%,-50%) translate(-245px,-80px)}
/* the legacy corner anchors must not fight the pentagon placement */

  left:50%!important;right:auto!important;top:50%!important;bottom:auto!important;
}

  function translateGame(){
    if(translating || !pt()) return;
    var g = document.getElementById('game');
    if(!g || g.classList.contains('hidden')) return;
    translating = true;
    var w = document.createTreeWalker(g, NodeFilter.SHOW_TEXT), n;
    while((n = w.nextNode())){
      var raw = n.nodeValue, key = raw.trim();
      if(!key) continue;
      var tr = GAME_PT[key];
      if(tr && tr !== key) n.nodeValue = raw.replace(key, tr);
    }
    translating = false;
  }

      '<div class="n-eyebrow">' + esc(trainingLabel()) + '</div>' +
      '<h2 class="n-h2">' + t('Signal check','Verificação de sinal') + '</h2>' +
      '<div class="ring"><b>96%</b></div>' +
      '<p class="n-lead n-center"><b>' + t('Headset connected','Headset ligado') + ' ✓</b><br>' +
        t('Signal quality · Excellent','Qualidade do sinal · Excelente') + '</p>' +
      '<div class="n-ctaRow n-center"><button class="n-cta" onclick="startGame()">' +
        t('BEGIN TRAINING','COMEÇAR TREINO') + '</button></div>' +
    '</section>';
    nHeader(); window.scrollTo(0,0);
  };
  try{ setupTrain = window.setupTrain; }catch(e){}

  /* Training brief: one objective, no internal difficulty code. */
  window.selectTraining = function(id){
    var x=findTraining(id); S.trainingId=x.id; S.training=trName(x);
    var m=main(); if(!m) return; m.className='';
    var live=x.status==='live';
    m.innerHTML='<section class="n-page n-v93-detail">' +
      '<button class="n-v93-back" onclick="go(\'train\')">← '+t('Back to catalogue','Voltar ao catálogo')+'</button>'+
      '<div class="n-eyebrow">'+esc(seg().label)+' · '+statusTag(x)+'</div>'+
      '<h1 class="n-h1">'+esc(trName(x))+'</h1><p class="n-lead">'+esc(trDesc(x))+'</p>'+
      (live?'<p class="n-objective">'+t('Prototype experience · simulated neurofeedback data.','Experiência do protótipo · dados de neurofeedback simulados.')+'</p><div class="n-ctaRow"><button class="n-cta" onclick="setupTrain()">'+t('START EXPERIENCE','INICIAR EXPERIÊNCIA')+'</button></div>':
      '<div class="n-v93-info"><b>'+statusTag(x)+'</b><p>'+ (x.status==='labs'?t('Research direction. No session is available in this prototype.','Linha de investigação. Não existe sessão disponível neste protótipo.'):t('Proposed protocol or programme. No session is available in this prototype.','Protocolo ou programa proposto. Não existe sessão disponível neste protótipo.'))+'</p></div>')+
      '</section>';
    nHeader(); window.scrollTo(0,0);
  };
  try{ selectTraining = window.selectTraining; }catch(e){}

  /* Strategy, session result and session report: English-only legacy
     screens, and the win banner was white text on a white panel.    */
  window.strategyTutorial = function(){
    var m = main(); if(!m) return;
    var cards = [
      { n:'01', b:t('Direct','Dirigir'),  d:t('Place your attention on the task, and keep it simple.','Coloca a atenção na tarefa e mantém-na simples.') },
      { n:'02', b:t('Allow','Permitir'),  d:t('Stop managing the result and see what happens.','Deixa de gerir o resultado e vê o que acontece.') },
      { n:'03', b:t('Expect','Esperar'),  d:t('Notice whether expecting it changes how easily it comes.','Repara se esperar que aconteça muda a facilidade com que acontece.') }
    ];
    m.className = '';
    m.innerHTML = '<section class="n-page">' +
      '<div class="n-eyebrow">' + t('BEFORE YOU TRAIN','ANTES DE TREINARES') + '</div>' +
      '<h1 class="n-h1">' + t('There is no single right way to control the game.',
                              'Não há uma forma certa de controlar o jogo.') + '</h1>' +
      '<p class="n-lead">' + t('Try a strategy, watch how the experience responds, then adjust.',
                               'Experimenta uma estratégia, observa como a experiência responde, e ajusta.') + '</p>' +
      '<div class="n-cards3">' + cards.map(function(c){
        return '<div class="n-card"><span class="n-num">' + c.n + '</span><h3>' + c.b + '</h3><p>' + c.d + '</p></div>';
      }).join('') + '</div>' +
      '<div class="n-ctaRow"><button class="n-cta" onclick="setupTrain()">' + t("I'M READY",'ESTOU PRONTO') + '</button></div>' +
    '</section>';
    nHeader(); window.scrollTo(0,0);
  };
  try{ strategyTutorial = window.strategyTutorial; }catch(e){}

  function metric(v, k, c){
    return '<div class="n-metric"><b>' + v + '</b><strong>' + k + '</strong><span>' + c + '</span></div>';
  }

  window.endGame = function(){
    var g = document.getElementById('game');
    if(g){ g.classList.add('hidden'); g.innerHTML = ''; }
    var m = main(); if(!m) return;
    m.className = '';
    m.innerHTML = '<section class="n-page">' +
      '<div class="n-eyebrow">' + t('SESSION','SESSÃO') + ' ' + S.session + ' / ' + S.totalSessions + ' · ' +
        t('COMPLETE','CONCLUÍDA') + '</div>' +
      '<h1 class="n-h1">' + t('You are building consistency.','Estás a criar consistência.') + '</h1>' +
      '<div class="winBanner"><b>' + t('EARLY PROOF · PROGRESS VISIBLE','PROVA INICIAL · PROGRESSO VISÍVEL') + '</b>' +
        '<p>' + t('You improved on your own first session, even as the challenge increased.',
                  'Melhoraste face à tua primeira sessão, mesmo com o desafio a aumentar.') + '</p></div>' +
      '<div class="n-metrics">' +
        metric('+37%', t('more time in the target state','mais tempo no estado-alvo'), t('vs. session 1','vs. sessão 1')) +
        metric('−18%', t('to return after a distraction','para voltar depois de uma distração'), t('vs. session 1','vs. sessão 1')) +
        metric(S.session + '/' + S.totalSessions, t('sessions completed','sessões concluídas'), t('programme','programa')) +
      '</div>' +
      programDots() +
      '<div class="n-ctaRow">' +
        '<button class="n-cta" onclick="sessionReport()">' + t('SESSION REPORT','RELATÓRIO DA SESSÃO') + '</button>' +
        '<button class="n-cta ghost" onclick="go(\'progress\')">' + t('PROGRESS','PROGRESSO') + '</button>' +
      '</div>' +
    '</section>';
    setView('sessionresult'); nHeader(); window.scrollTo(0,0);
  };
  try{ endGame = window.endGame; }catch(e){}

  window.sessionReport = function(){
    var m = main(); if(!m) return;
    m.className = '';
    m.innerHTML = '<section class="n-page">' +
      '<div class="n-eyebrow">' + t('PARTICIPANT REPORT','RELATÓRIO DO PARTICIPANTE') + ' · ' +
        t('Session','Sessão') + ' ' + S.session + '/' + S.totalSessions + '</div>' +
      '<h1 class="n-h1">' + t('What changed in this session.','O que mudou nesta sessão.') + '</h1>' +
      '<div class="n-metrics">' +
        metric('+37%', t('more time in the target state','mais tempo no estado-alvo'), t('vs. session 1','vs. sessão 1')) +
        metric('−18%', t('to return after a distraction','para voltar depois de uma distração'), t('vs. session 1','vs. sessão 1')) +
        metric('↑', t('challenge increased','desafio aumentou'), t('and performance held','e o desempenho aguentou')) +
      '</div>' +
      '<p class="n-objective"><b>' + t('Next objective','Próximo objectivo') + ':</b> ' +
        t('hold the same stability as the challenge keeps rising.',
          'manter a mesma estabilidade à medida que o desafio continua a subir.') + '</p>' +
      '<div class="n-ctaRow">' +
        '<button class="n-cta" onclick="window.print()">' + t('EXPORT','EXPORTAR') + '</button>' +
        '<button class="n-cta ghost" onclick="go(\'progress\')">' + t('PROGRESS','PROGRESSO') + '</button>' +
      '</div>' +
    '</section>';
    setView('sessionreport'); nHeader(); window.scrollTo(0,0);
  };
  try{ sessionReport = window.sessionReport; }catch(e){}

  /* Profile and progress: mock numbers instead of a wall of qualifiers. */
  var ABIL = [
    { en:'Focus',      po:'Foco',       base:62, now:74 },
    { en:'Regulation', po:'Regulação',  base:58, now:69 },
    { en:'Memory',     po:'Memória',    base:55, now:64 },
    { en:'Reaction',   po:'Reação',     base:67, now:78 },
    { en:'Control',    po:'Controlo',   base:60, now:71 },
    { en:'Decision',   po:'Decisão',    base:57, now:68 }
  ];
  function abilRows(mode){
    return '<div class="n-abil">' + ABIL.map(function(a){
      var name = pt() ? a.po : a.en;
      var val = (mode === 'compare')
        ? '<b>' + a.base + ' → ' + a.now + '</b><em>+' + (a.now - a.base) + '</em>'
        : '<b>' + a.base + '</b><em>' + t('starting point','ponto de partida') + '</em>';
      return '<div class="n-abilRow"><span>' + name + '</span>' + val + '</div>';
    }).join('') + '</div>';
  }

  window.measure = function(){
    return '<section class="n-page n-narrow">' +
      '<div class="n-eyebrow">BRAIN CHECK · 5 MIN</div>' +
      '<h2 class="n-h2">' + t('A quick snapshot of your mental abilities.',
                              'Uma fotografia rápida das tuas capacidades mentais.') + '</h2>' +
      '<p class="n-lead n-center">' + t('Five guided minutes create the reference you will compare with later.',
                                        'Cinco minutos guiados criam a referência com que vais comparar depois.') + '</p>' +
      '<div class="ring"><b>96%</b></div>' +
      '<p class="n-lead n-center"><b>' + t('Headset connected','Headset ligado') + ' ✓</b><br>' +
        t('Signal quality · Excellent','Qualidade do sinal · Excelente') + '</p>' +
      '<div class="n-ctaRow n-center"><button class="n-cta" onclick="braincheck()">' +
        t('START · 5 MIN','INICIAR · 5 MIN') + '</button></div>' +
    '</section>';
  };
  try{ measure = window.measure; }catch(e){}

  window.finalReport = function(){
    var m = main(); if(!m) return;
    m.className = '';
    m.innerHTML = '<section class="n-page">' +
      '<div class="n-eyebrow">' + t('SUMMARY · 10 SESSIONS','RESUMO · 10 SESSÕES') + '</div>' +
      '<h1 class="n-h1">' + t('What changed across the programme.','O que mudou ao longo do programa.') + '</h1>' +
      '<div class="n-split">' +
        '<div class="n-radar">' +
          '<div class="n-legend"><span class="base"><i></i>' + t('Start','Início') + '</span>' +
          '<span class="now"><i></i>' + t('Now','Agora') + '</span></div>' + v89Radar('compare') + '</div>' +
        '<div>' + abilRows('compare') +
          '<p class="n-objective">' + t('Every value is read against this participant\'s own starting point.',
                                        'Cada valor é lido contra o ponto de partida deste participante.') + '</p>' +
          '<button class="n-cta" style="margin-top:14px" onclick="window.print()">' + t('EXPORT','EXPORTAR') + '</button>' +
        '</div>' +
      '</div>' +
    '</section>';
    setView('finalreport'); nHeader(); window.scrollTo(0,0);
  };
  try{ finalReport = window.finalReport; }catch(e){}

  window.participantProfile = function(){
    var m = main(); if(!m) return;
    m.className = '';
    m.innerHTML = '<section class="n-page">' +
      '<div class="n-eyebrow">' + t('PROFILE','PERFIL') + '</div>' +
      '<h1 class="n-h1">' + t('Your starting profile.','O teu perfil de partida.') + '</h1>' +
      '<p class="n-lead">' + t('These values are your own reference, not a grade.',
                               'Estes valores são a tua própria referência, não uma nota.') + '</p>' +
      '<div class="n-split">' +
        '<div class="n-radar">' + v89Radar('baseline') + '</div>' +
        '<div>' + abilRows('baseline') +
          '<button class="n-cta" style="margin-top:22px" onclick="go(\'train\')">' + t('TRAIN','TREINAR') + '</button>' +
        '</div>' +
      '</div>' +
    '</section>';
    setView('profile'); nHeader(); window.scrollTo(0,0);
  };
  try{ participantProfile = window.participantProfile; }catch(e){}

  window.progress = function(){
    return '<section class="n-page">' +
      '<div class="n-eyebrow">' + t('PROGRESS · AFTER 10 SESSIONS','PROGRESSO · APÓS 10 SESSÕES') + '</div>' +
      '<h1 class="n-h1">' + t('Where you started. Where you are now.','Onde começaste. Onde estás agora.') + '</h1>' +
      '<p class="n-lead">' + t('Change is read against your own starting point, never against other people.',
                               'A mudança é lida contra o teu próprio ponto de partida, nunca contra outras pessoas.') + '</p>' +
      '<div class="n-split">' +
        '<div class="n-radar">' +
          '<div class="n-legend"><span class="base"><i></i>' + t('Start','Início') + '</span>' +
          '<span class="now"><i></i>' + t('Now','Agora') + '</span></div>' + v89Radar('compare') + '</div>' +
        '<div>' + abilRows('compare') +
          '<button class="n-cta" style="margin-top:22px" onclick="finalReport()">' +
            t('SEE SUMMARY','VER RESUMO') + '</button>' +
        '</div>' +
      '</div>' +
    '</section>';
  };
  try{ progress = window.progress; }catch(e){}

  /* Legacy participant screens: keep S.view honest so a language or
     segment change re-renders the screen the user is actually on.   */
  var LEGACY_VIEWS = {
    strategyTutorial:'strategy', setupTrain:'setup', signalRecovery:'signal',
    sessionReport:'sessionreport', endGame:'sessionresult', braincheck:'measure',
    assessment:'measure'
  };
  Object.keys(LEGACY_VIEWS).forEach(function(name){
    var fn = window[name];
    if(typeof fn !== 'function') return;
    window[name] = function(){ var r = fn.apply(this, arguments); setView(LEGACY_VIEWS[name]); nHeader(); return r; };
  });
  (function(){
    var fn = window.selectTraining;
    if(typeof fn !== 'function') return;
    window.selectTraining = function(name){ var r = fn.apply(this, arguments); setView('selected'); nHeader(); return r; };
    try{ selectTraining = window.selectTraining; }catch(e){}
  })();
  (function(){
    var fn = window.results;
    if(typeof fn !== 'function') return;
    window.results = function(fromMeasure){ var r = fn.apply(this, arguments); setView(fromMeasure ? 'profile' : 'sessionresult'); nHeader(); return r; };
    try{ results = window.results; }catch(e){}
  })();

  /* ---------- 10. MATURITY LABELS REMOVED AT SOURCE -------------- */
  window.v84Mat = function(){ return ''; };
  window.v84Legend = function(){ return ''; };
  try{ v84Mat = window.v84Mat; v84Legend = window.v84Legend; }catch(e){}
  function stripMaturity(){
    document.querySelectorAll('.maturity,.v84Legend').forEach(function(el){ el.remove(); });
  }
  new MutationObserver(stripMaturity).observe(document.body,{childList:true,subtree:true});

  /* ---------- 10b. GAME LOOP LIFECYCLE ---------------------------
     Every game draw loop re-queues itself with requestAnimationFrame
     and never stopped when the session ended, so loops accumulated
     and the prototype degraded during a long demo. rAF is used only
     by those loops, so it is gated on the game overlay being open. */
  var _raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function(cb){
    var g = document.getElementById('game');
    if(g && g.classList.contains('hidden')) return 0;
    return _raf(cb);
  };

  /* ---------- 11. BOOT ------------------------------------------- */
  document.body.className = 'seg-' + S.segment.toLowerCase();
  var m0 = main();
  if(m0){ m0.className = ''; m0.innerHTML = nLanding(); }
  nHeader();
  stripMaturity();
  window.scrollTo(0,0);
})();
</script>

</style><script id="v94-app">/* Neroes v9.4 — visual dashboard, resting reference and honest demo data */

function eegDetail(){const bands=[['Theta','4–8 Hz',22],['Alpha','8–12 Hz',35],[t('Low beta','Beta baixa'),'12–16 Hz',20],[t('High beta','Beta alta'),'16–25 Hz',14],['Gamma','25–45 Hz',9]];return '<details><summary>'+t('EEG detail · illustrative band power','Detalhe EEG · potência de bandas ilustrativa')+'</summary><p class="note">'+t('Relative power (%) · single illustrative channel. No emotional interpretation.','Potência relativa (%) · um canal ilustrativo. Sem interpretação emocional.')+'</p><div class="eeg">'+bands.map((x,i)=>'<div><span class="bar" style="height:'+x[2]*3+'px;background:'+['#75a9dd','#55e3cc','#9385df','#ca96dd','#d5b171'][i]+'"></span><b>'+x[2]+'%</b><small>'+x[0]+'<br>'+x[1]+'</small></div>').join('')+'</div><div class="kicker">'+t('SPECTRUM · RELATIVE AMPLITUDE (a.u.)','ESPECTRO · AMPLITUDE RELATIVA (u.a.)')+'</div><svg viewBox="0 0 600 120" role="img" aria-label="'+t('Illustrative EEG spectrum','Espectro EEG ilustrativo')+'"><path d="M20 85 L40 72 L60 75 L80 57 L100 63 L120 25 L140 40 L160 60 L180 58 L200 69 L220 68 L240 74 L260 79 L280 78 L300 85 L320 89 L340 86 L360 92 L380 89 L400 97 L420 94 L440 98 L460 101 L480 96 L500 103 L520 99 L540 106 L580 105" class="wave"/><text x="20" y="120" fill="#9ab2c1" font-size="11">0 Hz</text><text x="540" y="120" fill="#9ab2c1" font-size="11">45 Hz</text></svg></details>';}

(function(){
const t=(en,pt)=>S.lang==='PT'?pt:en;
const abilities={
 focus:{PT:'Foco',EN:'Focus',value:74,starting:62},
